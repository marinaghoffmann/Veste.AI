services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-vesteai}
      POSTGRES_USER: ${DATABASE_USERNAME:-vesteai}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-vesteai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
